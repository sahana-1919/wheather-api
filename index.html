<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #74b9ff, #0984e3);
        }

        .container {
            width: 90%;
            max-width: 420px;

            background: white;
            padding: 30px;

            border-radius: 20px;
            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #0984e3;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        button {
            padding: 12px 18px;

            border: none;
            border-radius: 8px;

            background: #0984e3;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0767ad;
        }

        #weather {
            margin-top: 25px;
        }

        #weatherIcon {
            width: 100px;
        }

        #temperature {
            font-size: 50px;
            font-weight: bold;
            color: #0984e3;
        }

        #condition {
            font-size: 20px;
            font-weight: bold;
        }

        #error {
            color: red;
            margin-top: 15px;
        }

        .info {
            margin: 10px 0;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather App</h1>

        <div class="search-box">

            <input
                type="text"
                id="locationInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

        <p id="error"></p>

        <div id="weather">

            <h2 id="city">Search for a city</h2>

            <img
                id="weatherIcon"
                src=""
                alt="Weather"
            >

            <div>
                <span id="temperature">--</span> °C
            </div>

            <p id="condition">--</p>

            <p class="info">
                Feels like:
                <span id="feelsLike">--</span> °C
            </p>

            <p class="info">
                Humidity:
                <span id="humidity">--</span>%
            </p>

            <p class="info">
                Wind:
                <span id="wind">--</span> km/h
            </p>

        </div>

    </div>


    <script>

        // API KEY
        const API_KEY = "c0cf290b56284be5917143213261108";


        // API BASE URL
        const API_URL =
            "https://api.weatherapi.com/v1/current.json";


        // HTML ELEMENTS
        const input =
            document.getElementById("locationInput");

        const button =
            document.getElementById("searchBtn");

        const city =
            document.getElementById("city");

        const temperature =
            document.getElementById("temperature");

        const condition =
            document.getElementById("condition");

        const feelsLike =
            document.getElementById("feelsLike");

        const humidity =
            document.getElementById("humidity");

        const wind =
            document.getElementById("wind");

        const weatherIcon =
            document.getElementById("weatherIcon");

        const error =
            document.getElementById("error");


        // GET WEATHER
        async function getWeather() {

            const location =
                input.value.trim();


            // Check empty input
            if (location === "") {

                error.textContent =
                    "Please enter a city name.";

                return;
            }


            error.textContent = "Loading...";


            try {

                // CREATE DYNAMIC API URL
                const url =
                    `${API_URL}?key=${API_KEY}&q=${encodeURIComponent(location)}&aqi=yes`;


                console.log("API URL:", url);


                // CALL API
                const response =
                    await fetch(url);


                // CONVERT RESPONSE TO JSON
                const data =
                    await response.json();


                console.log("API DATA:", data);


                // CHECK API ERROR
                if (data.error) {

                    error.textContent =
                        data.error.message;

                    return;
                }


                // CITY
                city.textContent =
                    `${data.location.name}, ${data.location.country}`;


                // TEMPERATURE
                temperature.textContent =
                    Math.round(data.current.temp_c);


                // CONDITION
                condition.textContent =
                    data.current.condition.text;


                // FEELS LIKE
                feelsLike.textContent =
                    Math.round(data.current.feelslike_c);


                // HUMIDITY
                humidity.textContent =
                    data.current.humidity;


                // WIND
                wind.textContent =
                    data.current.wind_kph;


                // WEATHER ICON
                let icon =
                    data.current.condition.icon;


                if (icon.startsWith("//")) {

                    icon =
                        "https:" + icon;

                }


                weatherIcon.src = icon;


                // REMOVE ERROR
                error.textContent = "";


            } catch (err) {

                console.error(err);

                error.textContent =
                    "Unable to get weather. Check your internet connection.";

            }

        }


        // SEARCH BUTTON
        button.addEventListener(
            "click",
            getWeather
        );


        // ENTER KEY
        input.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    getWeather();

                }

            }
        );

    </script>

</body>

</html>
